name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Marketplace Trusted Publishing: vsce trades the job's OIDC token for a
      # short-lived publish credential, so no PAT is stored. The publisher's
      # "Release workflow" policy names this repository and release.yml.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
      # vsce 4 needs Node 22; --oidc arrived in 4.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # dependencies are bundled by esbuild and pnpm's node_modules layout
      # cannot be scanned by vsce, so --no-dependencies is required
      - run: npx @vscode/vsce@4.1.0 package --no-dependencies
      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce@4.1.0 publish --oidc --no-dependencies --packagePath ./*.vsix
      - name: Upload .vsix to the GitHub Release
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" ./*.vsix
        env:
          GH_TOKEN: ${{ github.token }}
