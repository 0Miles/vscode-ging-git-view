name: Manual Publish

# Manually publish the version currently in package.json to the VS Code
# Marketplace. Use this for one-off / recovery publishes; the normal release
# flow goes through release-please in release.yml.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Marketplace Trusted Publishing, through the publisher's "Manual
      # publish" policy for this file; see release.yml.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
      # vsce 4 needs Node 22; --oidc arrived in 4.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # dependencies are bundled by esbuild and pnpm's node_modules layout
      # cannot be scanned by vsce, so --no-dependencies is required
      - run: npx @vscode/vsce@4.1.0 package --no-dependencies
      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce@4.1.0 publish --oidc --no-dependencies --packagePath ./*.vsix
