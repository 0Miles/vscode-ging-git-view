name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format
      - run: pnpm run l10n:check
      - run: pnpm run adr:check
      - run: pnpm run test

  # The Windows-only code paths (ADR-0028's taskkill, the askpass script path)
  # only run here. `format` stays on ubuntu: `.gitattributes` line-ending rules
  # make it noisy on a Windows checkout.
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  extension-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: xvfb-run -a pnpm run test:ext

  # The Electron E2E (ADR-0032): the unpackaged desktop build in apps/desktop,
  # driven by Playwright under a virtual display.
  desktop-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # electron and its dependencies require Node >=22.12
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run compile:desktop
      # Electron's binary downloads on first use otherwise, inside a test's timeout.
      - run: pnpm --filter @ging/desktop exec install-electron
      # Recorded for when Chromium's sandbox stops starting here: Ubuntu's
      # AppArmor setting that restricts unprivileged user namespaces.
      - run: sysctl kernel.apparmor_restrict_unprivileged_userns || true
      - run: xvfb-run -a pnpm run test:e2e:desktop

  # The webview harness in Playwright's Chromium, once per webview entry
  # (e2e/webview). The VS Code entry's page loads the compiled bundle, so
  # compile runs first; headless Chromium needs no display.
  webview-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run compile
      # No --with-deps: its apt list names font packages ubuntu-latest (26.04)
      # no longer carries, and the image already has the libraries Chromium
      # needs, as desktop-e2e's Electron shows. Headless runs use the shell.
      - run: pnpm exec playwright install --only-shell chromium
      - run: pnpm run test:e2e:webview
